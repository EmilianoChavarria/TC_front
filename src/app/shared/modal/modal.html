<div
  class="fixed inset-0 z-50 grid place-items-center overflow-y-auto bg-ink-900/40 px-4 py-8"
  (pointerdown)="onPointerDown($event)"
  (pointerup)="onPointerUp($event)"
>
  <div
    #panel
    tabindex="-1"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="title()"
    class="w-full rounded-lg bg-white shadow-xl outline-none"
    [class]="width()"
  >
    @if (title() || dismissible()) {
      <div class="flex items-start justify-between gap-4 px-6 py-4">
        <div class="min-w-0">
          @if (title()) {
            <h2 class="text-lg font-semibold text-ink-900">{{ title() }}</h2>
          }
          @if (subtitle()) {
            <p class="mt-0.5 truncate text-sm text-ink-500">{{ subtitle() }}</p>
          }
        </div>

        @if (dismissible()) {
          <button
            type="button"
            class="-mr-1 shrink-0 rounded-md p-1 text-ink-500 transition hover:bg-canvas hover:text-ink-900"
            (click)="close()"
            aria-label="Cerrar"
          >
            <app-icon name="close" [size]="18" />
          </button>
        }
      </div>
    }

    <div class="px-6 py-5">
      <ng-content />
    </div>

    <div class="flex items-center justify-end gap-3 px-6 py-4">
      <ng-content select="[modalFooter]" />

      @if (!customFooter()) {
        <button type="button" class="btn-ghost" (click)="close()">{{ cancelLabel() }}</button>
        <button
          type="button"
          [class]="confirmVariant() === 'danger' ? 'btn-danger' : 'btn-primary'"
          [disabled]="confirmDisabled()"
          (click)="confirm()"
        >
          {{ confirmLabel() }}
        </button>
      }
    </div>
  </div>
</div>
